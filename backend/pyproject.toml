[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-backend"
version = "0.1.0"
description = "NDTP ingestion, causal state and dispatcher API for transport delay prediction"
requires-python = ">=3.12"
dependencies = [
    "transport-ml",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.27,<1",
    "numpy>=2.2,<2.3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]

[project.scripts]
transport-backend = "transport_backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
